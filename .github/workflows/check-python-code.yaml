name: Check Python package code

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - '.github/workflows/check-python-code.yaml'
  push:
    branches: [main, dev]
    paths:
      - 'packages/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - '.github/workflows/check-python-code.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.resolution }}, py${{ matrix.python }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Default resolution exercises the committed lock against every
        # supported Python minor version. The lowest-direct cell pins each
        # direct dependency to its declared floor (see UV_RESOLUTION below)
        # and runs only on the Python floor, since the resolved-low pyspark
        # 3.4 wheels exist for 3.10/3.11 only.
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        resolution: [default]
        include:
          - python: "3.10"
            resolution: lowest-direct

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # No setup-java: the test suite runs on the jdk4py JDK from the dev
      # group. Its floor (JDK 17) is what lowest-direct resolves, matching
      # pyspark 3.4, which does not support the runners' default Java 21.

      # UV_RESOLUTION=lowest-direct makes `uv sync` re-resolve every direct
      # dependency to the lowest version permitted by pyproject.toml. This
      # exercises the declared floor (e.g. pyspark==3.4.0) instead of
      # whatever the committed lock happens to point at. Failures here mean
      # a direct dep's minimum needs to be bumped. Set via GITHUB_ENV only
      # in the relevant cell so default cells run with no UV_RESOLUTION at
      # all -- otherwise an empty value is rejected by uv.
      - name: Configure resolution
        if: matrix.resolution == 'lowest-direct'
        run: echo "UV_RESOLUTION=lowest-direct" >> "$GITHUB_ENV"

      # Fail fast if uv.lock is stale (e.g. a pyproject.toml version bump
      # landed without a matching `uv lock` run). Only for the default
      # resolution cells -- lowest-direct intentionally re-resolves away
      # from the committed lock, so `--locked` would always fail there.
      - name: Configure lock check
        if: matrix.resolution == 'default'
        run: echo "UV_LOCKED=1" >> "$GITHUB_ENV"

      - name: Run make check
        run: make check
