name: Publish Python packages to PyPI

on:
  push:
    branches: [main]
    paths:
      - '**/pyproject.toml'
  workflow_dispatch:
    inputs:
      aws_iam_role_name:
        description: The name of the IAM role to assume for accessing CodeArtifact
        type: string
        required: false
        default: GithubActions_Schema_CodeArtifact_Publish
      domain:
        description: The CodeArtifact domain name
        type: string
        required: false
        default: overture-pypi
      repository:
        description: The CodeArtifact repository name
        type: string
        required: false
        default: overture

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check for changes
    if: github.event.repository.full_name == github.repository
    uses: ./.github/workflows/reusable-check-python-package-versions.yaml
    permissions:
      contents: read  # Required for checkout in reusable workflow
      id-token: write # Required for OIDC in reusable workflow to check AWS CodeArtifact
    with:
      before_commit: ${{ github.event.before }}
      after_commit: ${{ github.event.after }}

  publish:
    name: Publish
    needs: [check]
    if: github.event.repository.full_name == github.repository && needs.check.outputs.num_changed_packages > 0
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for OIDC authentication to AWS

    strategy:
      matrix:
        include: ${{ fromJson(needs.check.outputs.changed_packages) }}
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: latest

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync code to make packages visible to Python
        run: uv sync --locked --all-packages

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::505071440022:role/GithubActions_Schema_CodeArtifact_Publish
          role-session-name: GitHubActions_${{github.job}}_${{github.run_id}}

      - name: Get CodeArtifact credentials
        id: get-code-artifact-params
        uses: ./.github/actions/code-artifact

      # overture-schema-pyspark ships generated validation expressions that are
      # not committed to git -- they are regenerated on demand from the Pydantic
      # models. `uv build` packages whatever is on disk under the module root, so
      # the tree must be generated here before the build, or the published wheel
      # ships without its `expressions/generated/` modules and validate_model()
      # discovers nothing to run.
      - name: Generate PySpark expressions before build
        if: matrix.package == 'overture-schema-pyspark'
        run: make generate-pyspark

      - name: Publish package ${{ matrix.package }} version ${{ matrix.after }} to PyPI
        env:
          CA_TOKEN: ${{ steps.get-code-artifact-params.outputs.token }}
          CA_PUBLISH_URL: ${{ steps.get-code-artifact-params.outputs.publish_url }}
          PACKAGE: ${{ matrix.package }} # zizmor: ignore[template-injection]
          BEFORE: ${{ matrix.before }} # zizmor: ignore[template-injection]
          AFTER: ${{ matrix.after }} # zizmor: ignore[template-injection]
        run: |
          printf 'Publishing package %s version %s to PyPI (previous version %s)...\n' "$PACKAGE" "$AFTER" "$BEFORE"
          uv build --package "$PACKAGE"
          wheel="dist/${PACKAGE//-/_}-${AFTER}-py3-none-any.whl"
          if [ ! -f "$wheel" ]; then
            echo "    Wheel file [$wheel] not found. Aborting!"
            exit 1
          fi
          # Guard against a silently empty wheel: if the generate step above ever
          # regresses, overture-schema-pyspark would publish with no validation
          # expressions. Fail loudly instead of shipping a hollow package.
          if [ "$PACKAGE" = "overture-schema-pyspark" ] && \
             ! unzip -l "$wheel" | grep -q 'expressions/generated/.*\.py'; then
            echo "    Wheel [$wheel] has no generated expressions -- codegen did not run. Aborting!"
            exit 1
          fi
          tarball="dist/${PACKAGE//-/_}-${AFTER}.tar.gz"
          if [ ! -f "$tarball" ]; then
            echo "    Source tarball file [$tarball] not found. Aborting!"
            exit 1
          fi
          uv publish "$wheel" "$tarball" \
             -t "${CA_TOKEN}" \
            --publish-url "${CA_PUBLISH_URL}"
