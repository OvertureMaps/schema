name: Changelog fragment verification

# Enforces the changelog policy: any PR that changes a package must also carry
# that package's changelog update, either a new towncrier fragment under
# changelog.d/, or a built CHANGELOG.md (the result of running
# `uv run towncrier build`).
#
# "Changes a package" means any file under packages/<package>/ other than that
# package's own changelog artifacts (changelog.d/ and CHANGELOG.md). Every
# user-facing change gets a fragment, regardless of whether it bumps the
# version (see docs/versioning.md).
#
# PRs labeled `bot` skip this check. Dependabot is the only source of that
# label, and it's scoped to uv.lock and GitHub Actions version bumps, neither
# of which touches consumer-facing behavior.
#
# PRs that don't touch packages/ at all also skip: docs, CI config, and
# other root-level changes were never going to need a fragment, since
# check-fragment only ever looks at packages/<package>/ paths.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-scope:
    name: Detect package changes
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      packages-changed: ${{ steps.changed.outputs.any_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The merge base with the PR base branch must be reachable
          persist-credentials: false

      - id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: packages/**

  check-fragment:
    name: Require changelog on package change
    runs-on: ubuntu-slim
    needs: [detect-scope]
    if: >-
      needs.detect-scope.outputs.packages-changed == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'bot')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The merge base with the PR base branch must be reachable
          persist-credentials: false

      - name: Require a changelog update for each changed package
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")

          # Packages with changes outside their own changelog artifacts.
          touched=$(echo "$changed" \
            | grep -oE '^packages/[^/]+/' \
            | sort -u \
            | while read -r prefix; do
                pkg=$(basename "$prefix")
                if echo "$changed" | grep -E "^packages/${pkg}/" \
                  | grep -vE "^packages/${pkg}/(changelog\.d/|CHANGELOG\.md$)" \
                  | grep -q .; then
                  echo "$pkg"
                fi
              done)

          missing=""
          for pkg in $touched; do
            has_fragment=$(echo "$changed" \
              | grep -cE "^packages/${pkg}/changelog\.d/.+\.(breaking|feature|bugfix|docs|misc)\.md$" || true)
            has_changelog=$(echo "$changed" \
              | grep -cE "^packages/${pkg}/CHANGELOG\.md$" || true)
            if [ "$has_fragment" -eq 0 ] && [ "$has_changelog" -eq 0 ]; then
              missing="${missing}  - ${pkg}"$'\n'
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::These packages changed but include no changelog update:"
            printf '%s' "$missing"
            echo ""
            echo "Fix: one markdown file per package, named packages/<package>/changelog.d/<id>.<type>.md"
            echo "(type: breaking | feature | bugfix | docs | misc), body = one past-tense sentence."
            echo "Quick start: docs/versioning.md#changelog-quick-start"
            exit 1
          fi
          echo "Changelog fragment check passed."

  # check-fragment skips for bot-labeled PRs and PRs that don't touch
  # packages/, and branch protection can't require a job that sometimes
  # doesn't run. This gate always runs and passes on either a real success
  # or an accepted skip, so it's the check to require in branch protection
  # instead of check-fragment directly.
  changelog-fragment-status:
    name: Changelog fragment check status
    runs-on: ubuntu-slim
    needs: [detect-scope, check-fragment]
    if: always()
    permissions:
      contents: read
    steps:
      - uses: lowlydba/are-we-good@f506ed6324f55ec5e4ff5d92204a72c7f1c2b4f8 # v1.0.5
        with:
          jobs: ${{ toJSON(needs) }}