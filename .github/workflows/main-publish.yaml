name: Main publish

# Runs on every push to main that touches packages/**. For each package whose
# directory changed WITHOUT a version bump, computes an internal build version
# (main context; see .github/actions/compute-version) and dual-publishes it to
# both the legacy and MCD CodeArtifact accounts (ops-team#466). Bumped
# packages release via release-trigger + release-publish instead (see
# docs/versioning.md) -- publishing a .postN for them here too would be
# redundant.
#
# Also runs (read-only) on PRs that touch the compute-version/
# detect-affected-packages composite actions or this workflow itself, as a
# smoke test for their wiring: the version is computed but nothing is
# published.

on:
  push:
    branches: [main]
    paths:
      - packages/**
  pull_request:
    paths:
      - '.github/actions/compute-version/**'
      - '.github/actions/detect-affected-packages/**'
      - '.github/workflows/main-publish.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A real push must never be cancelled by a later one: every no-bump push
  # needs its own .postN build recorded in CodeArtifact. Only the PR smoke
  # test is safe to supersede.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: Detect affected packages${{ github.event_name == 'pull_request' && ' (test)' || '' }}
    if: github.event.repository.full_name == github.repository
    runs-on: ubuntu-slim
    permissions:
      contents: read # Read pyproject.toml/file history to detect affected packages
    outputs:
      count: ${{ steps.discover.outputs.count || steps.detect.outputs.count }}
      packages: ${{ steps.discover.outputs.packages || steps.detect.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A PR touching the composite actions rarely also touches packages/**,
      # so the real affected-package diff below would come back empty and
      # skip the smoke test entirely. Test every package's wiring instead.
      - name: Discover all packages (test)
        id: discover
        if: github.event_name == 'pull_request'
        run: |
          packages=$(for pkg_dir in packages/overture-schema*/; do
            [ -f "${pkg_dir}/pyproject.toml" ] && basename "$pkg_dir"
          done | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "count=$(echo "$packages" | jq 'length')" >> "$GITHUB_OUTPUT"
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"

      - name: Detect affected packages
        id: detect
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/detect-affected-packages
        with:
          before: ${{ github.event.before }}

  publish:
    name: Publish ${{ matrix.package }}${{ github.event_name == 'pull_request' && ' (test)' || '' }}
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for OIDC authentication to AWS
    strategy:
      fail-fast: false # One package's failure must not block sibling publishes
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.packages) }}
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync code to make packages visible to Python
        run: uv sync --locked --all-packages

      # PR smoke test only queries CodeArtifact (via compute-version, below)
      # and never publishes -- the publish steps are skipped for
      # pull_request. Assume the read-only role there so a wiring mistake
      # can't turn the smoke test into a real publish.
      - name: Get legacy CodeArtifact credentials
        id: ca-legacy
        uses: OvertureMaps/workflows/.github/actions/setup-codeartifact@main # zizmor: ignore[unpinned-uses] intentionally track main
        with:
          aws-role-arn: arn:aws:iam::505071440022:role/GithubActions_Schema_CodeArtifact_${{ github.event_name == 'pull_request' && 'ReadOnly' || 'Publish' }}
          codeartifact-domain: overture-pypi
          codeartifact-domain-owner: "505071440022"
          codeartifact-repository: overture
          format: pypi

      # Delegates to the same composite action the PR smoke test exercises, so
      # the version formula only has one implementation to keep correct.
      # Anchored to the legacy account only: both accounts host the same
      # package history, so either would compute the same version, and
      # picking one keeps this step from depending on the MCD dual-publish
      # below (which authenticates for itself via uv-publish-to-codeartifact).
      - name: Compute version
        id: compute
        uses: ./.github/actions/compute-version
        with:
          package: ${{ matrix.package }}
          context: main
          index_url: ${{ steps.ca-legacy.outputs.pypi-index-url }}

      # overture-schema-pyspark ships generated validation expressions that
      # are not committed to git; its packages/<pkg>/scripts/prebuild.sh
      # regenerates them before packaging. Every other package has no
      # prebuild.sh, so this step is a no-op for them.
      - name: Run package's prebuild script, if any
        env:
          PACKAGE: ${{ matrix.package }} # zizmor: ignore[template-injection]
        run: |
          set -euo pipefail
          script="packages/${PACKAGE}/scripts/prebuild.sh"
          if [ -f "$script" ]; then
            echo "Running ${script}"
            bash "$script"
          fi

      - name: Stamp computed version
        # Rewrites pyproject.toml only in this job's temporary checkout, never
        # committed: the released <major>.<minor>.<patch> stays human-owned,
        # this just labels the artifact this job builds and publishes.
        env:
          PACKAGE: ${{ matrix.package }} # zizmor: ignore[template-injection]
          VERSION: ${{ steps.compute.outputs.version }} # zizmor: ignore[template-injection]
        run: uv version "${VERSION}" --package "${PACKAGE}" --frozen

      - name: Build ${{ matrix.package }} ${{ steps.compute.outputs.version }}
        env:
          PACKAGE: ${{ matrix.package }} # zizmor: ignore[template-injection]
        run: uv build --package "${PACKAGE}"

      - name: Locate built artifacts for ${{ matrix.package }} ${{ steps.compute.outputs.version }}
        id: artifacts
        if: github.event_name != 'pull_request'
        env:
          PACKAGE: ${{ matrix.package }} # zizmor: ignore[template-injection]
          VERSION: ${{ steps.compute.outputs.version }} # zizmor: ignore[template-injection]
        run: |
          set -euo pipefail
          wheel="dist/${PACKAGE//-/_}-${VERSION}-py3-none-any.whl"
          if [ ! -f "$wheel" ]; then
            echo "    Wheel file [$wheel] not found. Aborting!"
            exit 1
          fi
          tarball="dist/${PACKAGE//-/_}-${VERSION}.tar.gz"
          if [ ! -f "$tarball" ]; then
            echo "    Source tarball file [$tarball] not found. Aborting!"
            exit 1
          fi
          echo "files=${wheel} ${tarball}" >> "$GITHUB_OUTPUT"

      # continue-on-error on both publish steps below, plus the explicit
      # failure check after, so a legacy outage doesn't hold back the MCD
      # publish (or vice versa) -- the job still fails overall if either did.
      - name: Publish ${{ matrix.package }} ${{ steps.compute.outputs.version }} to legacy CodeArtifact
        id: publish-legacy
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: OvertureMaps/workflows/.github/actions/uv-publish-to-codeartifact@f75f9fce8a30b4403905b09020aee07076a20a3e # workflows#97, pending merge
        with:
          aws-role-arn: arn:aws:iam::505071440022:role/GithubActions_Schema_CodeArtifact_Publish
          codeartifact-domain: overture-pypi
          codeartifact-domain-owner: "505071440022"
          codeartifact-repository: overture
          files: ${{ steps.artifacts.outputs.files }}

      - name: Publish ${{ matrix.package }} ${{ steps.compute.outputs.version }} to MCD CodeArtifact
        id: publish-mcd
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: OvertureMaps/workflows/.github/actions/uv-publish-to-codeartifact@f75f9fce8a30b4403905b09020aee07076a20a3e # workflows#97, pending merge
        with:
          aws-role-arn: arn:aws:iam::763944545891:role/codeartifact-pypi-publish-oidc-overturemaps
          codeartifact-domain: overture-pypi
          codeartifact-domain-owner: "763944545891"
          codeartifact-repository: overture
          files: ${{ steps.artifacts.outputs.files }}

      - name: Fail if either CodeArtifact publish failed
        if: github.event_name != 'pull_request' && (steps.publish-legacy.outcome == 'failure' || steps.publish-mcd.outcome == 'failure')
        run: exit 1
