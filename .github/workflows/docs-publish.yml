name: Trigger docs publication

# Fires when the umbrella overture-schema package's GitHub Release is
# published (see release-trigger.yaml and docs/versioning.md for the tag
# scheme) and dispatches a production rebuild of OvertureMaps/docs so its
# generated schema reference (docs/schema/reference/**, built via the
# OvertureMaps/workflows generate-schema-docs action) stays in sync with
# schema releases.
#
# Only the overture-schema release is dispatched: it's the sole release
# marked "Latest" and the only one carrying the vanity `v<version>` tag docs
# consumes as its recognized public schema version (see docs/versioning.md).
# Per-theme package releases (overture-schema-theme-*) don't independently
# version the docs site's reference and are skipped.
#
# Requires the overture-releaser app (release-trigger.yaml's app, #637) to
# also be installed on OvertureMaps/docs with an added `actions: write`
# permission -- it's schema-repo-only with `contents: write` today, and
# can't dispatch workflows on another repo. Extending it (deliberately
# bending omf-github-terraform's "one app per concern" convention rather
# than provisioning a new app) is a manual prerequisite tracked in #689.
#
# Reuses release-trigger.yaml's exact PEM fetch: same AWS Secrets Manager
# entry (omf-github-terraform/releaser/pem), same gha-releaser-secrets-reader
# OIDC role, same client ID, just scoped to permission-actions instead of
# permission-contents.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  dispatch-docs-build:
    name: Dispatch docs production build
    if: startsWith(github.event.release.tag_name, 'overture-schema-v')
    runs-on: ubuntu-slim
    permissions:
      contents: read # Read the vanity tag to resolve schema-ref
      id-token: write # Required for OIDC authentication to AWS
    steps:
      - name: Resolve schema-ref
        id: resolve-ref
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          # The umbrella release always ships alongside a bare vanity tag
          # (v<version>, see .github/actions/create-package-release and
          # docs/versioning.md); that's the recognized public schema version,
          # so prefer it over the package-prefixed release tag.
          version="${TAG_NAME#overture-schema-v}"
          vanity_tag="v${version}"

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${vanity_tag}" >/dev/null 2>&1; then
            echo "schema-ref=${vanity_tag}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Vanity tag ${vanity_tag} not found for ${TAG_NAME}; falling back to the release tag."
            echo "schema-ref=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # Narrow OIDC role (omf-github-terraform's oidc-aws.tf) that can only
      # read the releaser app's PEM secret.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::816069134238:role/gha-releaser-secrets-reader
          role-session-name: GitHubActions_${{github.job}}_${{github.run_id}}

      # Exports the PEM as env.RELEASE_PUBLISHER_APP_PEM, masked (incl. multi-line).
      - name: Fetch releaser PEM from Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@2cb1a461cbd4865ac4299648312e4704c646cd53 # v3.0.1
        with:
          secret-ids: |
            RELEASE_PUBLISHER_APP_PEM, omf-github-terraform/releaser/pem

      - name: Generate docs publisher app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23lijru2e660v1zJQO # overture-releaser app ID, not sensitive
          private-key: ${{ env.RELEASE_PUBLISHER_APP_PEM }} # zizmor: ignore[secrets-outside-env]
          owner: OvertureMaps
          repositories: docs
          permission-actions: write # Required to dispatch a workflow run on OvertureMaps/docs

      - name: Trigger docs production build
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SCHEMA_REF: ${{ steps.resolve-ref.outputs.schema-ref }}
        run: |
          gh workflow run production_deploy_documentation.yml \
            --repo OvertureMaps/docs \
            --field schema-ref="${SCHEMA_REF}"
