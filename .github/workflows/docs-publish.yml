name: Trigger docs publication

# Fires on the bare `v<version>` vanity tag that .github/actions/create-
# package-release creates only for the umbrella overture-schema package's
# release (see docs/versioning.md's tag scheme), and dispatches a production
# rebuild of OvertureMaps/docs so its generated schema reference
# (docs/schema/reference/**, built via the OvertureMaps/workflows
# generate-schema-docs action) stays in sync with schema releases.
#
# The `v*` tag glob is the filter: no other package's release creates a bare
# `v*` tag, so this only ever fires for overture-schema. github.ref_name is
# the vanity tag itself, used directly as schema-ref with no lookup needed.
#
# Caveat: create-package-release skips (warns, doesn't fail) the vanity tag
# step if that tag already exists, e.g. a re-cut release reusing a version.
# No new tag means no push event, so that rare case silently doesn't
# dispatch a docs rebuild; a maintainer can always re-run this workflow by
# hand (workflow_dispatch isn't wired up here, but `gh workflow run
# docs-publish.yml --ref v<version>` works against the existing tag).
#
# Requires the overture-releaser app (release-trigger.yaml's app, #637) to
# also be installed on OvertureMaps/docs with an added `actions: write`
# permission -- it's schema-repo-only with `contents: write` today, and
# can't dispatch workflows on another repo. Extending it (deliberately
# bending omf-github-terraform's "one app per concern" convention rather
# than provisioning a new app) is a manual prerequisite tracked in #689.
#
# Reuses release-trigger.yaml's exact PEM fetch: same AWS Secrets Manager
# entry (omf-github-terraform/releaser/pem), same gha-releaser-secrets-reader
# OIDC role, same client ID, just scoped to permission-actions instead of
# permission-contents.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  dispatch-docs-build:
    name: Dispatch docs production build
    runs-on: ubuntu-slim
    permissions:
      id-token: write # Required for OIDC authentication to AWS
    steps:
      # Narrow OIDC role (omf-github-terraform's oidc-aws.tf) that can only
      # read the releaser app's PEM secret.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::816069134238:role/gha-releaser-secrets-reader
          role-session-name: GitHubActions_${{github.job}}_${{github.run_id}}

      # Exports the PEM as env.RELEASE_PUBLISHER_APP_PEM, masked (incl. multi-line).
      - name: Fetch releaser PEM from Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@2cb1a461cbd4865ac4299648312e4704c646cd53 # v3.0.1
        with:
          secret-ids: |
            RELEASE_PUBLISHER_APP_PEM, omf-github-terraform/releaser/pem

      - name: Generate docs publisher app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23lijru2e660v1zJQO # overture-releaser app ID, not sensitive
          private-key: ${{ env.RELEASE_PUBLISHER_APP_PEM }} # zizmor: ignore[secrets-outside-env]
          owner: OvertureMaps
          repositories: docs
          permission-actions: write # Required to dispatch a workflow run on OvertureMaps/docs

      - name: Trigger docs production build
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SCHEMA_REF: ${{ github.ref_name }}
        run: |
          gh workflow run production_deploy_documentation.yml \
            --repo OvertureMaps/docs \
            --field schema-ref="${SCHEMA_REF}"
