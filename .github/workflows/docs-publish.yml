name: Trigger docs publication

# Fires when the umbrella overture-schema package's GitHub Release is
# published (see release-trigger.yaml and docs/versioning.md for the tag
# scheme) and dispatches a production rebuild of OvertureMaps/docs so its
# generated schema reference (docs/schema/reference/**, built via the
# OvertureMaps/workflows generate-schema-docs action) stays in sync with
# schema releases.
#
# Only the overture-schema release is dispatched: it's the sole release
# marked "Latest" and the only one carrying the vanity `v<version>` tag docs
# consumes as its recognized public schema version (see docs/versioning.md).
# Per-theme package releases (overture-schema-theme-*) don't independently
# version the docs site's reference and are skipped.
#
# Requires a GitHub App installed on OvertureMaps/docs with `actions: write`
# (schema's own overture-release-publisher app is schema-repo-only with
# contents: write, see #637, and can't dispatch workflows on another repo).
# Provisioning that app and its secrets is a manual prerequisite tracked in
# #689.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  dispatch-docs-build:
    name: Dispatch docs production build
    if: startsWith(github.event.release.tag_name, 'overture-schema-v')
    runs-on: ubuntu-slim
    permissions:
      contents: read # Read the vanity tag to resolve schema-ref
    steps:
      - name: Resolve schema-ref
        id: resolve-ref
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          # The umbrella release always ships alongside a bare vanity tag
          # (v<version>, see .github/actions/create-package-release and
          # docs/versioning.md); that's the recognized public schema version,
          # so prefer it over the package-prefixed release tag.
          version="${TAG_NAME#overture-schema-v}"
          vanity_tag="v${version}"

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${vanity_tag}" >/dev/null 2>&1; then
            echo "schema-ref=${vanity_tag}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Vanity tag ${vanity_tag} not found for ${TAG_NAME}; falling back to the release tag."
            echo "schema-ref=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # Manual prerequisite: the overture-docs-publisher app, its
      # installation on OvertureMaps/docs, and these two secrets are tracked
      # in #689 and don't exist yet.
      - name: Generate docs publisher app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DOCS_PUBLISHER_APP_ID }} # zizmor: ignore[secrets-outside-env]
          private-key: ${{ secrets.DOCS_PUBLISHER_APP_PEM }} # zizmor: ignore[secrets-outside-env]
          owner: OvertureMaps
          repositories: docs
          permission-actions: write # Required to dispatch a workflow run on OvertureMaps/docs

      - name: Trigger docs production build
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SCHEMA_REF: ${{ steps.resolve-ref.outputs.schema-ref }}
        run: |
          gh workflow run production_deploy_documentation.yml \
            --repo OvertureMaps/docs \
            --field schema-ref="${SCHEMA_REF}"
