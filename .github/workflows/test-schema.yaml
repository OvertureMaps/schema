# This is based on the Go starter workflow from:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Validate schema, examples, and counterexamples

on:
  push:
    paths:
      - 'schema/**'
      - 'examples/**'
      - 'counterexamples/**'
  # No path filter on pull_request: "Build" is a required status check (see
  # schema.yml in omf-github-terraform), and GitHub never satisfies a
  # required check that a path filter prevents from running.
  pull_request: {}

permissions:
  contents: read

concurrency:
  # push never fires for fork PRs, so pull_request is the only trigger a
  # required check can rely on from external contributors.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.22

      - name: Install dependencies
        run: go install github.com/santhosh-tekuri/jsonschema/cmd/jv@latest

      - name: Validate
        run: ./test.sh
