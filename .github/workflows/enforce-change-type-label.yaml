name: Change Type label verification

on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-label:
    name: Check label
    runs-on: ubuntu-slim

    permissions:
      contents: read # Required for reading PR labels

    steps:
      - name: Require exactly one change type label
        run: |
          set -euo pipefail

          change_type_labels='change type - cosmetic 🌹
          change type - documentation - docs team 📝
          change type - documentation - member 📝
          change type - major 🚨
          change type - minor 🤏
          automation 🦾'

          applied=$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH" \
            | grep -Fxf <(echo "$change_type_labels" | sed 's/^[[:space:]]*//') || true)
          count=$(echo "$applied" | grep -c . || true)

          if [ "$count" -ne 1 ]; then
            echo "::error::The PR must have EXACTLY one change type label; it has ${count}."
            echo "Allowed labels:"
            echo "$change_type_labels" | sed 's/^[[:space:]]*/  - /'
            if [ "$count" -gt 1 ]; then
              echo "Currently applied:"
              echo "$applied" | sed 's/^/  - /'
            fi
            exit 1
          fi
          echo "Change type label check passed: ${applied}"