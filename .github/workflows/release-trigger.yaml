name: Publish GitHub release

# Runs on every push to main that touches any package's pyproject.toml.
# For each package whose <major>.<minor>.<patch> was bumped, cuts a published
# GitHub Release tagged `<package>-v<version>`, titled `` `<package>` <version> ``,
# with notes taken from that package's CHANGELOG.md section.
#
# Packages version independently (see docs/versioning.md). The umbrella
# `overture-schema` release is marked "Latest"; all others are not.
#
# Release notes come from towncrier: a release PR bumps the version and runs
# `uv run towncrier build`, folding that package's changelog.d/ fragments into its
# CHANGELOG.md (reviewed in the PR). This workflow reads back the section.
#
# All three version components are human-owned; any increase (patch included)
# is a release. No-bump merges publish internal `.postN` builds instead (see
# .github/actions/compute-version).
#
# Releases are created with the overture-release-publisher app's installation
# token, not GITHUB_TOKEN: GITHUB_TOKEN-created releases don't fire downstream
# `release: published` events, which release-publish.yaml needs to pick up
# each release individually. See #637 for provisioning that app.
#
# The app's PEM lives in AWS Secrets Manager (omf-github-terraform), fetched
# here via the narrowly-scoped gha-releaser-secrets-reader OIDC role -- same
# pattern as the safe-settings and project-manager app PEMs.

on:
  push:
    branches: [main]
    paths:
      - packages/*/pyproject.toml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect version bumps
    if: github.event.repository.full_name == github.repository
    runs-on: ubuntu-slim
    permissions:
      contents: read # Read pyproject.toml history to detect bumps
    outputs:
      count: ${{ steps.detect.outputs.count }}
      bumps: ${{ steps.detect.outputs.bumps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect version bumps
        id: detect
        uses: ./.github/actions/detect-version-bumps
        with:
          before: ${{ github.event.before }}

  release:
    name: Release ${{ matrix.package }} ${{ matrix.version }}
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-slim
    permissions:
      contents: read # App token below carries the actual release-creation grant
      id-token: write # Required for OIDC authentication to AWS
    strategy:
      fail-fast: false # One package's failure must not block sibling releases
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.bumps) }}
    steps:
      # Narrow OIDC role (omf-github-terraform's oidc-aws.tf) that can only
      # read the releaser app's PEM secret.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::816069134238:role/gha-releaser-secrets-reader
          role-session-name: GitHubActions_${{github.job}}_${{github.run_id}}

      # Exports the PEM as env.RELEASE_PUBLISHER_APP_PEM, masked (incl. multi-line).
      - name: Fetch releaser PEM from Secrets Manager
        uses: aws-actions/aws-secretsmanager-get-secrets@2cb1a461cbd4865ac4299648312e4704c646cd53 # v3.0.1
        with:
          secret-ids: |
            RELEASE_PUBLISHER_APP_PEM, omf-github-terraform/releaser/pem

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23lijru2e660v1zJQO # overture-release-publisher app ID, not sensitive
          private-key: ${{ env.RELEASE_PUBLISHER_APP_PEM }} # zizmor: ignore[secrets-outside-env]
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # For the `overture-schema package, `uv` is needed to generate the
      # official JSON Schema release asset.
      - name: Install uv
        if: matrix.package == 'overture-schema'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Generate unified JSON schema
        if: matrix.package == 'overture-schema'
        run: |
          set -euo pipefail
          uv sync --locked --all-packages
          uv run overture-schema json-schema --tag overture > overture-schema.json

      - name: Create release
        uses: ./.github/actions/create-package-release
        with:
          package: ${{ matrix.package }}
          version: ${{ matrix.version }}
          tag: ${{ matrix.tag }}
          target: ${{ github.event.after }}
          latest: ${{ matrix.package == 'overture-schema' }}
          # The umbrella package continues the legacy bare tag series as a
          # vanity tag (no second release); see docs/versioning.md.
          vanity-tag: ${{ matrix.package == 'overture-schema' && format('v{0}', matrix.version) || '' }}
          # Only the umbrella release carries the unified JSON schema artifact.
          assets: ${{ matrix.package == 'overture-schema' && 'overture-schema.json' || '' }}
          # App token so the release fires its own `release: published` event
          # for release-publish.yaml (GITHUB_TOKEN would not); see #637.
          token: ${{ steps.app-token.outputs.token }}
