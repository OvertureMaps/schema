name: Refresh uv.lock

# Stands in for Dependabot's uv version updates, which are paused
# (open-pull-requests-limit: 0 in .github/dependabot.yml) until
# dependabot-core#14073 is fixed (tracked in #614). `uv lock --upgrade`
# re-resolves every dependency, direct and transitive, to the newest version each
# pyproject.toml already allows, touching only uv.lock. pyproject.toml ranges
# change only by hand, for a reason (a needed capability, or avoiding a fixed bug).
#
# Once #614 is fixed, raise that limit and remove this workflow.

on:
  schedule:
    - cron: "0 8 * * 4" # Thursdays
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: uv-lock-refresh
  cancel-in-progress: false

jobs:
  lock:
    name: Refresh uv.lock
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      # The default GITHUB_TOKEN can't clear the required "OMF PR Check" linked-issue
      # check -- a scheduled lockfile refresh has no issue to link. The
      # overture-pull-requester app (same one rebase-vnext.yaml uses) has a
      # bypass for that, so open the PR as the app instead; this also means the PR
      # triggers CI normally, unlike a GITHUB_TOKEN-authored PR.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23liiN80WEARreTV7m
          private-key: ${{ secrets.OVERTURE_PULL_REQUESTER_APP_PEM }} # zizmor: ignore[secrets-outside-env]
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - run: uv lock --upgrade

      # create-pull-request stages the diff, commits, pushes a branch, and
      # opens/updates the PR idempotently; a gh pr create script would
      # re-implement that and need persisted checkout credentials to push.
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with: # zizmor: ignore[superfluous-actions]
          token: ${{ steps.app-token.outputs.token }}
          # author/committer must match the Signed-off-by address for DCO to pass.
          # create-pull-request otherwise defaults author to whoever triggered the
          # run (github.actor), which fails DCO on a manual workflow_dispatch.
          author: overture-pull-requester[bot] <overture-pull-requester[bot]@users.noreply.github.com>
          committer: overture-pull-requester[bot] <overture-pull-requester[bot]@users.noreply.github.com>
          commit-message: |
            [CHORE](deps) refresh uv.lock

            Signed-off-by: overture-pull-requester[bot] <overture-pull-requester[bot]@users.noreply.github.com>
          branch: uv-lock-refresh
          title: "[CHORE](deps) weekly uv.lock refresh"
          labels: "bot,automation 🦾"
          body: "Automated `uv lock --upgrade` at the workspace root. Resolves transitive deps that Dependabot's uv ecosystem does not touch. pyproject.toml files are unchanged."
