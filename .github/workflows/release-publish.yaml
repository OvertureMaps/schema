name: Release publish

# Triggered when a GitHub Release is published (created by release-trigger.yaml
# using the overture-releaser app token -- see #637 -- so the native
# `release: published` event actually fires; GITHUB_TOKEN would not).
#
# Builds the released package at its released version and publishes it to
# public PyPI via Trusted Publishing (OIDC) + attestations, gated by that
# package's pypi-release-<package> Environment's required reviewers.
#
# Each package gets its own environment pair rather than one shared
# pypi-release/test-pypi pair: a PyPI Trusted Publisher's identity is (repo,
# workflow filename, environment), so a shared name across packages would let
# only one package's project name ever bind to it (see #653).
#
# To route approval notifications to Slack instead of the GitHub UI, install
# the GitHub app in the target channel and subscribe it to this repository's
# deployment reviews -- see
# https://docs.github.com/en/actions/how-tos/manage-workflow-runs/manage-environments-for-deployment
# and https://github.com/integrations/slack#subscribing-to-a-repository.
# No workflow changes needed; approval gating stays entirely in each
# pypi-release-<package> Environment.

on:
  release:
    types: [published]
  # Dry-run: publish a package's current on-disk version to Test PyPI
  # instead.
  workflow_dispatch:
    inputs:
      package:
        description: Package directory name to dry-run publish to Test PyPI (e.g. overture-schema-common)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # One release event per package version; never cancel an in-flight publish.
  # workflow_dispatch runs key off the chosen package instead of a tag.
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.package }}
  cancel-in-progress: false

jobs:
  parse:
    name: Parse package and version
    if: github.event_name == 'workflow_dispatch' || github.event.repository.full_name == github.repository
    runs-on: ubuntu-slim
    outputs:
      package: ${{ steps.parse.outputs.package }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      # workflow_dispatch has no release tag to parse; read the package's
      # current on-disk version instead, so checkout/uv only run on that path.
      - name: Check out repo
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        if: github.event_name == 'workflow_dispatch'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Parse package and version
        id: parse
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! -d "packages/${INPUT_PACKAGE}" ]]; then
              echo "::error::No such package: packages/${INPUT_PACKAGE}"
              exit 1
            fi
            package="$INPUT_PACKAGE"
            version=$(cd "packages/${package}" && uv version --short)
          elif [[ "$TAG" =~ ^(.+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            package="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[2]}"
          else
            echo "::error::Release tag '${TAG}' is not <package>-v<major>.<minor>.<patch>; nothing to publish."
            exit 1
          fi
          echo "package=${package}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ needs.parse.outputs.package }} ${{ needs.parse.outputs.version }} to ${{ github.event_name == 'workflow_dispatch' && 'Test PyPI' || 'PyPI' }}
    needs: parse
    runs-on: ubuntu-latest
    # Per-package environment name: see #653 (shared name across packages
    # would break Trusted Publisher registration).
    environment: ${{ github.event_name == 'workflow_dispatch' && format('test-pypi-{0}', needs.parse.outputs.package) || format('pypi-release-{0}', needs.parse.outputs.package) }}
    permissions:
      contents: read
      id-token: write # Required for PyPI Trusted Publishing (OIDC)
    env:
      PACKAGE: ${{ needs.parse.outputs.package }}
      VERSION: ${{ needs.parse.outputs.version }}
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: latest
          enable-cache: false # Publish job builds and ships immediately; no cache to poison downstream runs

      - name: Check out released commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.release.target_commitish }}
          persist-credentials: false

      - name: Sync code to make packages visible to Python
        run: uv sync --locked --all-packages

      # overture-schema-pyspark's scripts/prebuild.sh regenerates its
      # not-committed expressions before packaging; other packages have none.
      - name: Run package's prebuild script, if any
        run: |
          set -euo pipefail
          script="packages/${PACKAGE}/scripts/prebuild.sh"
          if [ -f "$script" ]; then
            echo "Running ${script}"
            bash "$script"
          fi

      # Fails fast if the checked-out commit's version doesn't match the
      # release tag. uv has no built-in check for this (astral-sh/uv#9653).
      - name: Verify on-disk version matches the release
        run: |
          set -euo pipefail
          on_disk="$(cd "packages/${PACKAGE}" && uv version --short)"
          if [ "$on_disk" != "$VERSION" ]; then
            echo "::error::packages/${PACKAGE} is at version ${on_disk}, but the release tag says ${VERSION}. Aborting!"
            exit 1
          fi

      - name: Build ${{ env.PACKAGE }} ${{ env.VERSION }}
        run: uv build --package "${PACKAGE}"

      - name: Publish ${{ env.PACKAGE }} ${{ env.VERSION }} to ${{ github.event_name == 'workflow_dispatch' && 'Test PyPI' || 'PyPI' }}
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: dist/
          attestations: true
          repository-url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/legacy/' || '' }}
          skip-existing: ${{ github.event_name == 'workflow_dispatch' }} # Don't fail on version conflicts during dry-runs
