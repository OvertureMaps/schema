---
version: 2
updates:

  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "actions/*"
    open-pull-requests-limit: 5
    labels:
      - "bot"
      - "automation 🦾" # Required for enforce-change-type-label.yaml check
    commit-message:
      prefix: "[CHORE](deps)"
      include: "scope"
    cooldown:
      default-days: 7

  # Maintain Python dependencies across the uv workspace (root + packages/*)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # uv doesn't yet support dependency-type filters in groups
      # (dependabot-core#13202), so dev and production deps aren't split here.
      python-dependencies:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
    labels:
      - "bot"
      - "automation 🦾" # Required for enforce-change-type-label.yaml check
    commit-message:
      prefix: "[CHORE](deps)"
      include: "scope"
    cooldown:
      default-days: 7
