name: Create package release
description: >
  Creates a published GitHub Release for a single package from its towncrier
  CHANGELOG.md.

  Reads the `## [<version>]` section of `packages/<package>/CHANGELOG.md` for
  the release notes (falling back to a pointer message if absent), fails if the
  target tag already exists, and creates the release tagged
  `<package>-v<version>` at `target`. Optionally also creates a bare vanity
  tag (no second GitHub Release) to continue a legacy tag series.

  Prerequisites: repo must be checked out and the GitHub CLI (`gh`) available
  (both true on GitHub-hosted runners).

inputs:
  package:
    description: Package directory name under packages/ (e.g. overture-schema).
    required: true
  version:
    description: Release version, major.minor.patch (e.g. 1.18.0).
    required: true
  tag:
    description: Release tag (e.g. overture-schema-v1.18.0).
    required: true
  target:
    description: Commit SHA the tag should point at.
    required: true
  latest:
    description: Whether to mark this release as "Latest" (true/false).
    required: false
    default: "false"
  vanity-tag:
    description: >
      Optional additional bare git tag to create at `target` (e.g. v1.18.0),
      with no GitHub Release attached. A pre-existing tag warns instead of
      failing; the vanity tag is cosmetic and must not fail a completed
      release.
    required: false
    default: ""
  dry-run:
    description: >
      When "true", resolve and print what would be released without creating
      anything. Read-only: a pre-existing tag is reported as a warning, not a
      failure.
    required: false
    default: "false"
  token:
    description: "Token used to create the release (needs contents: write)."
    required: true
  assets:
    description: >
      Optional whitespace-separated list of asset files to attach to the
      release (e.g. overture-schema.json). Uploaded atomically as part of
      `gh release create`. Ignored on a dry run.
    required: false
    default: ""

outputs:
  release-url:
    description: URL of the created release, or empty on a dry run.
    value: ${{ steps.release.outputs.release-url }}

runs:
  using: composite
  steps:
    - name: Create release
      id: release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PACKAGE: ${{ inputs.package }}
        VERSION: ${{ inputs.version }}
        TAG: ${{ inputs.tag }}
        TARGET: ${{ inputs.target }}
        LATEST: ${{ inputs.latest }}
        VANITY_TAG: ${{ inputs.vanity-tag }}
        DRY_RUN: ${{ inputs.dry-run }}
        ASSETS: ${{ inputs.assets }}
      run: |
        set -euo pipefail

        tag_exists=false
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          tag_exists=true
        fi

        if [ "$tag_exists" = "true" ] && [ "$DRY_RUN" != "true" ]; then
          echo "::error::Release ${TAG} already exists. A duplicate ${PACKAGE} ${VERSION} bump landed on main; investigate before re-releasing."
          exit 1
        fi

        changelog="packages/${PACKAGE}/CHANGELOG.md"
        notes=$(python3 "${GITHUB_ACTION_PATH}/extract_release_notes.py" "$VERSION" "$changelog")
        if [ -z "$notes" ]; then
          notes="Release ${VERSION} of \`${PACKAGE}\`. No changelog section was found; add towncrier fragments under \`packages/${PACKAGE}/changelog.d\` and run \`uv run towncrier build --config pyproject.toml --dir packages/${PACKAGE} --version ${VERSION}\`."
        fi
        printf '%s\n' "$notes" > "${RUNNER_TEMP}/notes.md"

        latest_flag="--latest=false"
        [ "$LATEST" = "true" ] && latest_flag="--latest"

        # Validate requested assets exist before the dry-run branch, so a dry
        # run catches a missing or misnamed asset.
        read -ra assets <<< "$ASSETS"
        for asset in "${assets[@]}"; do
          if [ ! -f "$asset" ]; then
            echo "::error::Release asset not found: ${asset}"
            exit 1
          fi
        done

        if [ "$DRY_RUN" = "true" ]; then
          [ "$tag_exists" = "true" ] && echo "::warning::Release ${TAG} already exists; a real run would fail here."
          {
            echo "## 🔍 Dry run: \`${PACKAGE}\` ${VERSION}"
            echo ""
            echo "Would create tag \`${TAG}\` at \`${TARGET}\` (${latest_flag})."
            if [ -n "$VANITY_TAG" ]; then
              echo "Would also create vanity tag \`${VANITY_TAG}\` (no release)."
            fi
            if [ ${#assets[@]} -gt 0 ]; then
              echo "Would attach assets: \`${assets[*]}\`."
            fi
            echo ""
            echo "<details><summary>Notes</summary>"
            echo ""
            cat "${RUNNER_TEMP}/notes.md"
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "release-url=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        gh release create "$TAG" \
          --repo "$GITHUB_REPOSITORY" \
          --target "$TARGET" \
          --title "\`${PACKAGE}\` ${VERSION}" \
          --notes-file "${RUNNER_TEMP}/notes.md" \
          $latest_flag \
          "${assets[@]}"

        url=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
        echo "release-url=${url}" >> "$GITHUB_OUTPUT"

        # Vanity tag: a bare ref continuing the legacy series, no second
        # release. Cosmetic, so a collision warns rather than failing the
        # already-published release.
        if [ -n "$VANITY_TAG" ]; then
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VANITY_TAG}" >/dev/null 2>&1; then
            echo "::warning::Vanity tag ${VANITY_TAG} already exists; leaving it untouched."
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${VANITY_TAG}" \
              -f sha="$TARGET" >/dev/null
            echo "Created vanity tag ${VANITY_TAG} at ${TARGET}."
          fi
        fi

        {
          echo "## 📦 Released \`${PACKAGE}\` ${VERSION}"
          echo ""
          echo "Tag \`${TAG}\`: [published GitHub Release](${url})."
          if [ -n "$VANITY_TAG" ]; then
            echo ""
            echo "Vanity tag \`${VANITY_TAG}\` continues the legacy series (no separate release)."
          fi
          if [ -n "$ASSETS" ]; then
            echo ""
            echo "Attached assets: \`${ASSETS}\`."
          fi
        } >> "$GITHUB_STEP_SUMMARY"
