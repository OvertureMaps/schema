name: Compute package version
description: >
  Computes the internal build version string for a package on a no-bump merge.

  All three released version components (<major>.<minor>.<patch>) are
  human-owned in pyproject.toml; releases publish that version as-is. This
  action only versions the interim internal builds published to CodeArtifact
  between releases, using a PEP 440 post-release so they order AFTER the
  released version and are picked up by `>=<version>` specifiers:

    - `main`:  `<version>.post<run_number>+main.<shortsha>`
    - `vnext`: `<version>.post<run_number>+vnext.<shortsha>`

  The `+main`/`+vnext` local label distinguishes the two build streams; local
  labels are ignored during version comparison so ordering comes from
  `.post<run_number>` alone. Local versions are rejected by public PyPI, which
  guarantees these builds stay internal.

  Prerequisites: repo must be checked out and `uv` must be available.

inputs:
  package:
    description: Distribution package name (e.g. overture-schema-common).
    required: true
  context:
    description: >
      Branch context naming the build stream. Supported values: `main`,
      `vnext`.
    required: true

outputs:
  version:
    description: Computed version string (PEP 440).
    value: ${{ steps.compute.outputs.version }}

runs:
  using: composite
  steps:
    - name: Compute version
      id: compute
      shell: bash
      env:
        PACKAGE: ${{ inputs.package }}
        CONTEXT: ${{ inputs.context }}
        RUN_NUMBER: ${{ github.run_number }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        case "$CONTEXT" in
          main|vnext) ;;
          *)
            echo "::error::Unknown context '${CONTEXT}'. Supported: main, vnext."
            exit 1
            ;;
        esac

        SEED=$(cd "packages/${PACKAGE}" && uv version --short)
        SHORT_SHA=$(echo "$SHA" | cut -c1-7)

        VERSION="${SEED}.post${RUN_NUMBER}+${CONTEXT}.${SHORT_SHA}"

        echo "Computed version for ${PACKAGE} (${CONTEXT}): ${VERSION}"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"