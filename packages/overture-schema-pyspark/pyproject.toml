[build-system]
requires = ["uv_build>=0.11.32,<0.13"]
build-backend = "uv_build"

[project]
dependencies = [
    "click>=8.0",
    # 6.2 is the first release whose `files()` resolves a namespace portion
    # inside a zip; the stdlib gained the same fix in 3.13.
    "importlib-resources>=6.2; python_version < '3.13'",
    "overture-schema-system>=2.0.0",
    "packaging>=22",
]
description = "PySpark validation expressions for Overture Maps data"
license = "MIT"
maintainers = [
    {name = "Overture Maps Schema Working Group"},
]
name = "overture-schema-pyspark"
readme = "README.md"
requires-python = ">=3.10"
version = "2.0.0"

[project.urls]
Homepage = "https://overturemaps.org"
Source = "https://github.com/OvertureMaps/schema"
Issues = "https://github.com/OvertureMaps/schema/issues"

[project.optional-dependencies]
spark = ["pyspark>=3.4"]

[project.scripts]
overture-validate = "overture.schema.pyspark.cli:validate_cli"

[tool.uv.build-backend]
module-name = "overture.schema.pyspark"

[tool.uv.sources]
overture-schema-system = { workspace = true }
