[project]
maintainers = [
    {name = "Overture Maps Schema Working Group"},
]
dependencies = [
    "overture-schema-addresses-theme>=0.1.1",
    "overture-schema-base-theme>=0.1.1",
    "overture-schema-buildings-theme>=0.1.1",
    "overture-schema-divisions-theme>=0.1.1",
    "overture-schema-places-theme>=0.1.1",
    "overture-schema-transportation-theme>=0.1.1",
    "overture-schema-validation>=0.1.1",
    "overture-schema-cli>=0.1.1",
]
description = "Complete Overture Maps schema collection with all themes and types"
version = "1.17.1"
license = "MIT"
name = "overture-schema"
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Homepage = "https://overturemaps.org"
Source = "https://github.com/OvertureMaps/schema"
Issues = "https://github.com/OvertureMaps/schema/issues"

[tool.uv.sources]
overture-schema-addresses-theme = { workspace = true }
overture-schema-base-theme = { workspace = true }
overture-schema-buildings-theme = { workspace = true }
overture-schema-cli = { workspace = true }
overture-schema-validation = { workspace = true }
overture-schema-divisions-theme = { workspace = true }
overture-schema-places-theme = { workspace = true }
overture-schema-transportation-theme = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.32,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "overture.schema"
namespace = true
