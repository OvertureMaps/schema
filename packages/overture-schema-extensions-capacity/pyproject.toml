[project]
maintainers = [
    {name = "Overture Maps Schema Working Group"},
]
dependencies = [
    "overture-schema-theme-buildings",
    "overture-schema-theme-places",
    "overture-schema-system",
    "pydantic>=2.12.0",
]
description = "Overture Maps places and buildings extended with capacity support"
dynamic = ["version"]
license = "MIT"
name = "overture-schema-extensions-capacity"
readme = "README.md"
requires-python = ">=3.10"

[project.urls]
Homepage = "https://overturemaps.org"
Source = "https://github.com/OvertureMaps/schema"
Issues = "https://github.com/OvertureMaps/schema/issues"

[tool.uv.sources]
overture-schema-theme-buildings = { workspace = true }
overture-schema-theme-places = { workspace = true }
overture-schema-system = { workspace = true }

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.version]
path = "src/overture/schema/extensions/capacity/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/overture"]

[project.entry-points."overture.models"]
capacity = "overture.schema.extensions.capacity:Capacity"
