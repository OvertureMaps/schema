---
id: access-restrictions-segment-axle-limit
type: Feature
geometry:
  type: LineString
  coordinates:
    - [0, 0]
    - [0, 1]
properties:
  theme: transportation
  type: segment
  version: 1
  subtype: road
  class: motorway
  connectors:
    - connector_id: fooConnector
      at: 0
    - connector_id: barConnector
      at: 1
  access_restrictions:
    - access_type: denied
      when:
        mode: [hgv]
        vehicle:
          - dimension: axle_count
            comparison: greater_than_equal
            value: 5
